<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>panda-print</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/theme-init.js"></script>
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/" aria-label="panda-print home">
        <img src="/static/favicon.svg" alt="" width="32" height="32">
        <span>panda-print</span>
      </a>
      <label id="printer-pick" class="printer-pick" hidden>
        <span class="sr-only">Printer</span>
        <select id="printer-select"></select>
      </label>
      <button id="theme-btn" class="icon-btn" type="button" aria-label="Theme"></button>
    </div>
  </header>

  <div id="update-banner" class="update-banner" role="status" hidden>
    <span>panda-print was updated, so this page may look out of date.</span>
    <button id="update-reload" class="btn small primary" type="button">Reload</button>
  </div>

  <main class="wrap">
    <noscript><p class="notice bad">panda-print needs JavaScript to show the dashboard.</p></noscript>

    <div id="view-setup" hidden></div>
    <div id="view-printers" hidden></div>
    <div id="view-tools">
      <nav id="tool-tabs" class="tabs" role="tablist" aria-label="Utilities" hidden></nav>
      <div id="tools"></div>
      <section id="launcher" aria-labelledby="links-title" hidden>
        <h2 id="links-title" class="eyebrow">Quick links</h2>
        <div id="links-notice"></div>
        <ul id="links-grid" class="tiles"></ul>
      </section>
    </div>
  </main>

  <footer class="wrap foot">
    <span id="version"></span>
  </footer>
</body>
</html>
