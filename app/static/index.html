<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>panda-print</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/theme-init.js"></script>
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/" aria-label="panda-print home">
        <img src="/static/favicon.svg" alt="" width="32" height="32">
        <span>panda-print</span>
      </a>
      <span id="mock-pill" class="pill" hidden>Demo data</span>
      <button id="theme-btn" class="icon-btn" type="button" aria-label="Theme"></button>
    </div>
  </header>

  <main class="wrap">
    <noscript><p class="notice bad">panda-print needs JavaScript to show the dashboard.</p></noscript>

    <section id="launcher" aria-labelledby="links-title" hidden>
      <h2 id="links-title" class="eyebrow">Quick links</h2>
      <div id="links-notice"></div>
      <ul id="links-grid" class="tiles"></ul>
    </section>

    <nav id="tool-tabs" class="tabs" aria-label="Tools" hidden></nav>
    <div id="tools"></div>
  </main>

  <footer class="wrap foot">
    <span id="version"></span>
  </footer>
</body>
</html>
