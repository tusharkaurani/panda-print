# Label sheets that come with the app. Add your own below (restart not needed: this file is read each time).
# Sizes are the published dimensions of each pack, in millimetres; check one against your own pack, or use "Custom grid".
#
#   id        a short unique name
#   name      what the pack is called
#   paper     a4 | letter
#   cols/rows how many labels across and down
#   width/height   one label
#   left/top  from the paper's left and top edge to the first label
#   gap_x/gap_y    space between labels (0 when they touch)
#   radius    corner rounding of a label (only drawn with "Show label borders")
