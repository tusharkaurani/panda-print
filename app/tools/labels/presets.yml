# Label Sheet Maker presets that ship with the app: a name and the choices to apply (never the label text or logo).
# People can save their own presets in the app. To ship one with the code, add an entry under `presets:` here; the server
# writes the text for a saved preset at /api/labels/presets/<id>/yaml. Lengths are in millimetres.
#
#   kind      pack (a label pack with printed die cuts) | size (a plain sheet, laid out by label size)
#   pack      the id of a pack in templates.yml, or empty for your own measurements (then `grid` and `size` are needed)
#   paper     {width, height, media?, label?}   portrait size; `media` is the CUPS paper name, used when the printer offers it
#   size      {width, height}   one label (kind: size)
#   area      full | top | bottom   use only the top or the bottom half of the sheet; the rest stays blank (packs and plain sheets)
#   orientation auto | portrait | landscape;  margin, gap;  mode fill | grid | count; align center | start   (plain sheets)
#   look      shape rect | rounded | ellipse, radius, fill, border (colours as #rrggbb), border_width, color, family sans | serif | mono,
#             bold, italic, line_spacing
#   text      size (points, or null for the largest that fits), align, valign, pad, first_bold, first_scale, first_color
#   look.inset  mm of space between the cut line and the label itself
#   cut       none | grid (straight dashed lines between the places) | shape (a dashed line around each label)
#   content   {text, per_line}  optional: the label text the preset fills in (typed labels)
#   copies, repeat, marks (cut marks), media_type, quality, sheet_copies
presets:
- id: return-address-30
  name: Return address ×30, US Letter
  settings:
    unit: in
    kind: pack
    pack: '5160'
    paper:
      width: 215.9
      height: 279.4
      media: na_letter_8.5x11in
      label: Letter (8.5 × 11 in)
    look:
      shape: rounded
      radius: 2.0
      color: '#000000'
      family: sans
    text:
      size: 9.0
      align: left
      valign: middle
      pad: 2.0
    repeat: true
    media_type: labels
- id: round-stickers-40
  name: Round stickers, 40 mm on plain A4
  settings:
    unit: mm
    kind: size
    paper:
      width: 210.0
      height: 297.0
      media: iso_a4_210x297mm
      label: A4 (210 × 297 mm)
    size:
      width: 40.0
      height: 40.0
    orientation: auto
    mode: fill
    align: center
    margin: 0.5
    gap: 0.0
    area: full
    look:
      shape: ellipse
      radius: 2.0
      fill: '#ffebdb'
      border: '#ffdbdb'
      border_width: 1.0
      color: '#3b2f00'
      family: sans
      bold: true
      italic: false
      line_spacing: 1.2
      inset: 3.0
    text:
      size: null
      align: center
      valign: middle
      pad: 1.0
      first_bold: false
      first_scale: 1.3
      first_color: null
    copies: 1
    repeat: false
    cut: grid
    marks: true
    sheet_copies: 1
- id: kitchen-labels-a4
  name: Kitchen Labels - A4 Sheet
  settings:
    unit: mm
    kind: size
    paper:
      width: 210.0
      height: 297.0
      media: iso_a4_210x297mm
      label: A4 (210 × 297 mm)
    size:
      width: 50.0
      height: 31.0
    orientation: auto
    mode: fill
    align: center
    margin: 5.0
    gap: 0.0
    area: full
    look:
      shape: rounded
      radius: 2.0
      fill: '#ffe5e8'
      border: '#00ccff'
      border_width: 0.5
      color: '#3b2f00'
      family: sans
      bold: true
      italic: false
      line_spacing: 1.2
      inset: 3.0
    text:
      size: null
      align: center
      valign: middle
      pad: 1.0
      first_bold: false
      first_scale: 1.3
      first_color: null
    copies: 1
    repeat: false
    cut: grid
    marks: true
    media_type: stationery
    quality: 5
    sheet_copies: 1
    content:
      text: |-
        Oats
        Whole Wheat Flour
        All-Purpose Flour
        White Rice
        Brown Rice
        Semolina
        Kidney Beans
        Chickpeas
        Coffee Beans
        Instant Coffee
        Turkish Coffee
        Tea Leaves
        Green Tea
        White Sugar
        Brown Sugar
        Monk Fruit Sweetener
        Table Salt
        Black Pepper
        Turmeric Powder
        Red Chilli Powder
        Coriander Powder
        Cumin Seeds
        Mustard Seeds
        Muesli
        Cornflakes
        Mixed Nuts
        Chia Seeds
        Flax Seeds
        Biscuits & Cookies
        Baking Powder
        Baking Soda
        Cocoa Powder
        Cooking Oil
        Olive Oil
        Vinegar
        Honey
