# Print utilities: free online tools for things worth printing, grouped by category.
#
# This is the built-in list. To use your own, copy it to <config folder>/print-utilities.yml
# (next to links.yml) and edit it; the page picks up changes within a minute with no restart.
# If your file has a mistake the page says so and keeps showing this list.
#
# categories:
#   - name: Worksheets            required
#     description: ...            optional, one line under the heading
#     tools:
#       - name: Math-Drills       required
#         url: https://...        required, https://
#         description: ...        optional, one short line
#         art: worksheet          optional, the drawing on the card (see app/tools/utilities/ui/art.js):
#                                 passport worksheet math handwriting colouring calendar graph lined dots
#                                 pdf poster labels craft document
#         image: https://...      optional, a picture URL to show instead of the drawing
#
# Third-party sites: they change, add ads or move things behind a paid plan. Where a site is freemium
# the line says so. Nothing here is affiliated with panda-print.
categories:
  - name: Photos & IDs
    description: Passport and ID photos, sized and tiled so one sheet of photo paper does the job.
    tools:
      - name: ePassportPhoto
        url: https://www.epassportphoto.com/
        description: Crop a passport or visa photo to the right size and tile it onto 4×6 paper.
        art: passport
      - name: IDPhoto4You
        url: https://www.idphoto4you.com/
        description: Passport, visa and ID photos for many countries, ready to print.
        art: passport

  - name: Student worksheets
    description: Practice sheets by subject and grade, or made to order.
    tools:
      - name: Math-Drills
        url: https://www.math-drills.com/
        description: Thousands of free maths worksheets with answer keys.
        art: math
      - name: K5 Learning
        url: https://www.k5learning.com/free-worksheets
        description: Free reading and maths worksheets for kindergarten to grade 5.
        art: worksheet
      - name: WorksheetWorks
        url: https://www.worksheetworks.com/
        description: Make your own maths, handwriting and puzzle sheets.
        art: worksheet
      - name: Handwriting Worksheets
        url: https://handwritingworksheets.com/
        description: Type any words and print a handwriting practice sheet.
        art: handwriting
      - name: Math Worksheets 4 Kids
        url: https://www.mathworksheets4kids.com/
        description: Printable maths and English sheets for primary school.
        art: math
      - name: TLS Books
        url: https://www.tlsbooks.com/
        description: Free worksheets and activity pages for the early years.
        art: worksheet
      - name: Education.com
        url: https://www.education.com/resources/worksheets/
        description: Worksheets by grade and subject (free sign-up for the full library).
        art: worksheet
      - name: Dad's Worksheets
        url: https://www.dadsworksheets.com/
        description: Maths worksheet generators with several difficulty levels.
        art: math

  - name: Colouring pages
    description: Good for a quick, colourful print that exercises every ink.
    tools:
      - name: Crayola
        url: https://www.crayola.com/free-coloring-pages
        description: Free colouring pages for kids, by character and season.
        art: colouring
      - name: Super Coloring
        url: https://www.supercoloring.com/
        description: Large library of colouring pages, from simple to detailed.
        art: colouring
      - name: Best Coloring Pages for Kids
        url: https://www.bestcoloringpagesforkids.com/
        description: Animals, vehicles and holidays, printable as PDF.
        art: colouring
      - name: Just Color
        url: https://www.justcolor.net/
        description: Detailed colouring pages for older kids and adults.
        art: colouring

  - name: Calendars, planners & paper
    description: Plain paper in every ruling, and calendars for any month or year.
    tools:
      - name: Time and Date calendars
        url: https://www.timeanddate.com/calendar/
        description: Printable calendars for any year, with holidays for your country.
        art: calendar
      - name: Vertex42
        url: https://www.vertex42.com/calendars/
        description: Calendars and planners to print or download as spreadsheets.
        art: calendar
      - name: Calendar Labs
        url: https://www.calendarlabs.com/
        description: Monthly, yearly and weekly calendars in many layouts.
        art: calendar
      - name: Printable Paper
        url: https://www.printablepaper.net/
        description: Lined, graph, dot grid, music and checklist paper as PDF.
        art: lined
      - name: Incompetech graph paper
        url: https://incompetech.com/graphpaper/
        description: Graph, isometric, dot and polar paper, with the spacing you choose.
        art: graph
      - name: FreePrintable
        url: https://www.freeprintable.com/
        description: Planners, charts and other printable templates.
        art: dots

  - name: PDF & documents
    description: Tidy a file before it goes to the printer.
    tools:
      - name: iLovePDF
        url: https://www.ilovepdf.com/
        description: Merge, split, compress and rotate PDFs (free tier).
        art: pdf
      - name: PDF24 Tools
        url: https://tools.pdf24.org/en/
        description: "Free PDF tools: merge, split, compress, pages per sheet."
        art: pdf
      - name: Print Friendly & PDF
        url: https://www.printfriendly.com/
        description: Turn a web page into a clean, ad-free page to print.
        art: document

  - name: Posters, labels & crafts
    description: Bigger than one sheet, smaller than one sheet, or cut and fold.
    tools:
      - name: The Rasterbator
        url: https://rasterbator.net/
        description: Split any picture into pages and tape them into a poster.
        art: poster
      - name: BlockPosters
        url: https://www.blockposters.com/
        description: Turn an image into a multi-page poster, with page overlap.
        art: poster
      - name: Avery templates
        url: https://www.avery.com/templates
        description: Label and card templates for the sheets you buy.
        art: labels
      - name: Canon Creative Park
        url: https://creativepark.canon/en/
        description: Free papercraft, cards, certificates and calendars, for any printer.
        art: craft
