# Print utilities: free online tools for things worth printing, grouped by category.
#
# This is the built-in list. To use your own, copy it to <config folder>/print-utilities.yml
# (next to links.yml) and edit it; the page picks up changes within a minute with no restart.
# If your file has a mistake the page says so and keeps showing this list.
#
# categories:
#   - name: Worksheets            required
#     description: ...            optional, one line under the heading
#     tools:
#       - name: Math-Drills       required
#         url: https://...        required, https://
#         description: ...        optional, one short line
#         art: worksheet          optional, the drawing on the card (see app/tools/utilities/ui/art.js):
#                                 passport worksheet math handwriting colouring calendar graph lined dots
#                                 pdf poster labels craft document
#         image: https://...      optional, a picture URL to show instead of the drawing
#
# Every site below was read on 17 Oct 2026 and says, on its own pages, that using it costs nothing (several
# are paid for by ads). That is the site's claim, not a guarantee: sites change, and a few ask for a free
# account for some things; the description says so. Sites that charge for the result, or put their main
# content behind a membership, are left out. If you find one that is not free, remove it from your list and
# tell the maintainer. Nothing here is affiliated with panda-print.
categories:
  - name: Photos & IDs
    description: Passport and ID photos made in your browser, with a 4×6 sheet to print.
    tools:
      - name: FreePassport.photo
        url: https://freepassport.photo/
        description: Photo and 4×6 sheet both free, no watermark or account. Works on your device (first use loads about 45 MB).
        art: passport
      - name: PicToPassport
        url: https://pictopassport.com/
        description: Free passport photo and 4×6 sheet, no sign-up, processed on your device.
        art: passport

  - name: Student worksheets
    description: Practice sheets to print, with no account needed.
    tools:
      - name: Math-Drills
        url: https://www.math-drills.com/
        description: Over 70,000 maths worksheets, free to print, with answer keys.
        art: math
      - name: Handwriting Worksheets
        url: https://handwritingworksheets.com/
        description: Type any words and print a practice sheet, free, no sign-up.
        art: handwriting
      - name: Teaching Squared
        url: https://www.teachingsquared.com/
        description: Free worksheet sets for teachers and parents, no sign-up.
        art: worksheet

  - name: Colouring pages
    description: Good for a quick, colourful print that exercises every ink.
    tools:
      - name: Crayola
        url: https://www.crayola.com/free-coloring-pages
        description: Free colouring pages to download and print, by character and season.
        art: colouring
      - name: Best Coloring Pages for Kids
        url: https://www.bestcoloringpagesforkids.com/
        description: Free printable animals, vehicles and holiday pages (ad-supported).
        art: colouring

  - name: Calendars, planners & paper
    description: Plain paper in every ruling, and calendars for any month or year.
    tools:
      - name: Calendar Labs
        url: https://www.calendarlabs.com/
        description: Free calendars to download or print, for home, school or work.
        art: calendar
      - name: Printable Paper
        url: https://www.printablepaper.net/
        description: Lined, graph, dot grid and music paper, free as PDF (a paid bundle is optional).
        art: lined
      - name: Incompetech graph paper
        url: https://incompetech.com/graphpaper/
        description: Graph, isometric, dot and polar paper at the spacing you choose. Public domain (CC0).
        art: graph
      - name: FreePrintable
        url: https://www.freeprintable.com/
        description: Planners, charts and templates, "always free" for personal and school use.
        art: dots

  - name: PDF & documents
    description: Tidy a file before it goes to the printer.
    tools:
      - name: PDF24 Tools
        url: https://tools.pdf24.org/en/
        description: Merge, split, compress and arrange PDFs. Free with no limits, paid for by ads.
        art: pdf

  - name: Posters, labels & crafts
    description: Bigger than one sheet, smaller than one sheet, or cut and fold.
    tools:
      - name: The Rasterbator
        url: https://rasterbator.net/
        description: Split any picture into pages and tape them into a poster. Completely free.
        art: poster
      - name: BlockPosters
        url: https://www.blockposters.com/
        description: Turn an image into a multi-page poster, free.
        art: poster
      - name: Avery templates
        url: https://www.avery.com/templates
        description: Free label and card templates for the sheets you buy.
        art: labels
      - name: Canon Creative Park
        url: https://creativepark.canon/en/
        description: Free papercraft, cards and calendars for any printer (some need a free Canon ID).
        art: craft
