# Photo Sheets presets that ship with the app: a name and the choices to apply (never the photos).
# People can save their own presets in the app; to ship one with the code, use "Copy as YAML" on it
# and paste the result here (one entry under `presets:`). Lengths are in millimetres.
#
#   id            a short stable name (letters, digits, dashes)
#   name          shown on the preset button
#   settings:
#     photo       {width, height}
#     unit        mm | cm | in            how lengths are shown in the form
#     paper       {width, height, media?, label?}   portrait size; `media` is the CUPS paper name, used when the
#                 printer offers it, otherwise the size is matched
#     orientation auto | portrait | landscape
#     area        full | top | bottom | left | right   use only that half of the paper; the rest stays blank
#     margin, gap mm
#     mode        fill | grid | count     (grid needs cols and rows; count needs count)
#     align       center | start
#     fit         fill (crop to the size) | fit (show all of the photo)
#     marks, outline   true | false
#     media_type  a CUPS paper type, e.g. stationery (plain) or photographic-glossy; used when offered
#     quality     3 draft | 4 normal | 5 high
#     copies      copies of the whole sheet
presets:
  - id: id-35x45-a4
    name: ID photos 35 × 45 mm on A4
    settings:
      photo: {width: 35, height: 45}
      unit: mm
      paper: {width: 210, height: 297, media: iso_a4_210x297mm, label: A4}
      orientation: auto
      margin: 5
      gap: 2
      mode: fill
      align: center
      fit: fill
      marks: true
      outline: false
      media_type: stationery
      quality: 4

  - id: us-2x2-4x6
    name: US 2 × 2 in on 4 × 6 in photo paper
    settings:
      photo: {width: 50.8, height: 50.8}
      unit: in
      paper: {width: 101.6, height: 152.4, media: na_index-4x6_4x6in, label: 4 × 6 in}
      orientation: auto
      margin: 3
      gap: 2
      mode: fill
      align: center
      fit: fill
      marks: true
      outline: false
      media_type: photographic-glossy
      quality: 5

  - id: small-id-25x35-a4
    name: Small ID 25 × 35 mm on A4
    settings:
      photo: {width: 25, height: 35}
      unit: mm
      paper: {width: 210, height: 297, media: iso_a4_210x297mm, label: A4}
      orientation: auto
      margin: 5
      gap: 2
      mode: fill
      align: center
      fit: fill
      marks: true
      outline: false
      media_type: stationery
      quality: 4
